<section id="prediksi" class="section content-section">
  <div class="glass section-card">
    <div class="mb-10">
      <h2 class="section-main-title">Prediksi IPK Mahasiswa</h2>
      <p class="section-main-desc">
        Simulasi prediksi IPK mahasiswa berdasarkan pola belajar, aktivitas harian, dan kebiasaan hidup.
      </p>
    </div>

    <form method="POST" action="{% url 'dashboard' %}">
      {% csrf_token %}
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label class="label-modern">Rata-rata Tidur (2-8 jam)</label>
          <input type="number" step="0.1" min="2" max="8" name="tidur" id="tidur" class="input-modern" required>
        </div>
        <div>
          <label class="label-modern">Rata-rata Belajar (2-8 jam)</label>
          <input type="number" step="0.1" min="2" max="8" name="belajar" id="belajar" class="input-modern" required>
        </div>
        <div>
          <label class="label-modern">Rata-rata Bermain (0-8 jam)</label>
          <input type="number" step="0.1" min="0" max="8" name="bermain" id="bermain" class="input-modern" required>
        </div>
        <div>
          <label class="label-modern">Rata-rata Sosmed (0-8 jam)</label>
          <input type="number" step="0.1" min="0" max="8" name="sosmed" id="sosmed" class="input-modern" required>
        </div>
        <div>
          <label class="label-modern">Jumlah Kopi</label>
          <input type="number" min="0" max="3" name="kopi" id="kopi" class="input-modern" required>
        </div>
        <div>
          <label class="label-modern">Rata-rata Olahraga (0-3 jam)</label>
          <input type="number" step="0.1" min="0" max="3" name="olahraga" id="olahraga" class="input-modern" required>
        </div>
        <div>
          <label class="label-modern">Memiliki Laptop</label>
          <select id="laptop" name="laptop" class="input-modern">
            <option value="1">Yes</option>
            <option value="0">No</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn-primary mt-8 w-full">Prediksi IPK</button>
    </form>

    <div class="output-box mt-8">
      <h3 class="text-2xl font-bold mb-3">Hasil Prediksi</h3>
      <p id="hasilPrediksi" class="text-lg" style="color: white;">
        {% if prediction %}
          Estimasi IPK Anda: <span class="text-4xl font-bold block mt-2 text-yellow-300">{{ prediction }}</span>
        {% else %}
          Belum ada prediksi. Silakan isi form di atas.
        {% endif %}
      </p>
    </div>
  </div>
</section>
